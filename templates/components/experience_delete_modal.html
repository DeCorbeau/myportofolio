<div id="delete-experience-modal"
     class="skill-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title">
  <button type="button"
          class="skill-delete-modal__backdrop"
          popovertarget="delete-experience-modal"
          popovertargetaction="hide"
          aria-label="Close delete confirmation"></button>
  <div class="skill-delete-modal__content">
    <button type="button"
            class="skill-delete-modal__close"
            popovertarget="delete-experience-modal"
            popovertargetaction="hide"
            aria-label="Close delete confirmation">&times;</button>
    <h2 id="delete-experience-title">Delete Experience?</h2>
    <p>
      Are you sure you want to delete
      <strong id="delete-experience-name"></strong>?
    </p>
    <div class="skill-delete-modal__actions">
      <button type="button"
              class="button button-secondary"
              popovertarget="delete-experience-modal"
              popovertargetaction="hide">Cancel</button>
      <form id="delete-experience-form" method="post" action="">
        {% csrf_token %}
        <button type="submit" class="button button-danger">Yes, Delete</button>
      </form>
    </div>
  </div>
</div>
