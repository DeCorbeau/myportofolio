<div id="edit-experience-modal"
     class="form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-experience-modal-title">
  <button type="button"
          class="form-modal__backdrop"
          popovertarget="edit-experience-modal"
          popovertargetaction="hide"
          aria-label="Close edit experience form"></button>
  <div class="form-modal__content">
    <button type="button"
            class="form-modal__close"
            popovertarget="edit-experience-modal"
            popovertargetaction="hide"
            aria-label="Close edit experience form">&times;</button>
    <h2 id="edit-experience-modal-title">Edit Experience</h2>
    <form id="edit-experience-form" class="project-form">
      {% for field in edit_form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}<p class="form-help">{{ field.help_text }}</p>{% endif %}
        </div>
      {% endfor %}
      <div class="form-modal__actions">
        <button type="button"
                class="button button-secondary"
                popovertarget="edit-experience-modal"
                popovertargetaction="hide">Cancel</button>
        <button type="submit" class="button">Save Changes</button>
      </div>
    </form>
  </div>
</div>
