<div id="add-experience-modal"
     class="form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
  <button type="button"
          class="form-modal__backdrop"
          popovertarget="add-experience-modal"
          popovertargetaction="hide"
          aria-label="Close add experience form"></button>
  <div class="form-modal__content">
    <button type="button"
            class="form-modal__close"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Close add experience form">&times;</button>
    <h2 id="add-experience-modal-title">Add New Experience</h2>
    <!-- hx-include sends the search box too, so the current filter is kept -->
    <form id="experience-form"
          hx-post="{% url 'main:create_experience' %}"
          hx-include="#experience-search-form"
          hx-target="#experience-list"
          hx-swap="innerHTML"
          hx-disabled-elt="find button[type='submit']"
          hx-on::after-request="if (event.detail.successful) { this.reset(); document.getElementById('add-experience-modal').hidePopover(); }"
          data-error-title="Failed to add experience"
          class="project-form">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
            <p class="form-error">{{ error }}</p>
          {% endfor %}
        </div>
      {% endfor %}
      <div class="form-modal__actions">
        <button type="button"
                class="button button-secondary"
                popovertarget="add-experience-modal"
                popovertargetaction="hide">Cancel</button>
        <button type="submit" class="button">Add Experience</button>
      </div>
    </form>
  </div>
</div>
