{% for group in groups %}
  <div class="skill-category-group{% if group.open %} open{% endif %}" data-category="{{ group.code }}">
    <button type="button"
            class="skill-category-summary"
            hx-on:click="this.closest('.skill-category-group').classList.toggle('open')">{{ group.label }}</button>
    <div class="skill-collapse">
      <div class="skill-grid">
        {% for skill in group.skills %}
          {% include "components/skill_card.html" %}
        {% endfor %}
      </div>
    </div>
  </div>
{% empty %}
  <div class="empty-state">
    <p>{% if query %}No skill matches that name.{% else %}No skills have been added yet.{% endif %}</p>
  </div>
{% endfor %}
