{% extends 'base.html' %}

{% block meta %}
  <title>Add Skill - {{ short_name }}</title>
{% endblock meta %}

{% block content %}
  <main>
    <section class="skill-section">
      <div class="section-container">
        <h1 class="section-title">Add New Skill</h1>
        <form method="post"
              action="{% url 'main:create_skill' %}"
              class="project-form">
          {% csrf_token %}
          {% for field in form %}
            <div class="form-group">
              <label for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% for error in field.errors %}
                <p class="form-error">{{ error }}</p>
              {% endfor %}
            </div>
          {% endfor %}
          <button type="submit" class="button">Tambah Skill</button>
          <a href="{% url 'main:show_skill' %}" class="button button-secondary">Batal</a>
        </form>
      </div>
    </section>
  </main>
{% endblock content %}
